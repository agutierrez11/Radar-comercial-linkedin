<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One idea per slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:0; overflow:hidden; font-family: 'Inter', -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
</style>
</head>
<body>
<div class="slide-container" data-screen-label="04 One idea" style="position:relative; width:1920px; height:1080px; overflow:hidden; background:#ffffff;">

  <div data-object="true" data-object-type="textbox" style="position:absolute; left:80px; top:80px; width:600px; color:#86868b; font-size:18px; font-weight:400; letter-spacing:2px; text-transform:uppercase;">
    Rule 01
  </div>

  <!-- Hero phrase -->
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:160px; top:340px; width:1600px; height:250px; color:#1d1d1f; font-size:200px; font-weight:700; letter-spacing:-6px; line-height:1.25;">
    One idea.
  </div>
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:160px; top:600px; width:1600px; height:250px; color:#0071E3; font-size:200px; font-weight:700; letter-spacing:-6px; line-height:1.25;">
    One slide.
  </div>

  <div data-object="true" data-object-type="textbox" style="position:absolute; left:160px; top:980px; width:1600px; color:#86868b; font-size:20px; font-weight:400; letter-spacing:0.5px;">
    If a slide carries two ideas, split it. Don't compress.<sup>[3][4]</sup>
  </div>

</div>
