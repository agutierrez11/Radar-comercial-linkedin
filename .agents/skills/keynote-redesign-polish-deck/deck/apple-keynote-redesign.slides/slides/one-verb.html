<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One verb per slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:0; overflow:hidden; font-family: 'Inter', -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
</style>
</head>
<body>
<div class="slide-container" data-screen-label="05 One verb" style="position:relative; width:1920px; height:1080px; overflow:hidden; background:#000000;">

  <div data-object="true" data-object-type="textbox" style="position:absolute; left:80px; top:80px; width:600px; color:#8a8a8a; font-size:18px; font-weight:400; letter-spacing:2px; text-transform:uppercase;">
    Rule 02
  </div>

  <div data-object="true" data-object-type="textbox" style="position:absolute; left:160px; top:300px; width:1600px; color:#f5f5f7; font-size:48px; font-weight:400; letter-spacing:-0.5px; line-height:1.3;">
    Every slide names one action the audience should take from it.
  </div>

  <!-- Three example verbs -->
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:160px; top:520px; width:480px; height:130px; color:#ffffff; font-size:96px; font-weight:700; letter-spacing:-3px; line-height:1.25;">
    Buy.
  </div>
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:160px; top:680px; width:480px; color:#8a8a8a; font-size:22px; font-weight:400; line-height:1.4;">
    A price slide. One dollar amount.
  </div>

  <div data-object="true" data-object-type="textbox" style="position:absolute; left:720px; top:520px; width:480px; height:130px; color:#ffffff; font-size:96px; font-weight:700; letter-spacing:-3px; line-height:1.25;">
    Look.
  </div>
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:720px; top:680px; width:480px; color:#8a8a8a; font-size:22px; font-weight:400; line-height:1.4;">
    A chart slide. One trend line.
  </div>

  <div data-object="true" data-object-type="textbox" style="position:absolute; left:1260px; top:520px; width:520px; height:130px; color:#ffffff; font-size:96px; font-weight:700; letter-spacing:-3px; line-height:1.25;">
    Remember.
  </div>
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:1260px; top:680px; width:520px; color:#8a8a8a; font-size:22px; font-weight:400; line-height:1.4;">
    A stat slide. One number, 200pt.
  </div>

  <div data-object="true" data-object-type="textbox" style="position:absolute; left:160px; top:980px; width:1600px; color:#6e6e73; font-size:18px; font-weight:400; letter-spacing:0.5px;">
    Adapted from Reynolds, Presentation Zen.<sup>[4]</sup>
  </div>

</div>
</body>
</html>
