<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:0; overflow:hidden; font-family: 'Inter', -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
</style>
</head>
<body>
<div class="slide-container" data-screen-label="01 Cover" style="position:relative; width:1920px; height:1080px; overflow:hidden; background:#000000;">

  <!-- Tiny ID mark, top-left -->
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:80px; top:80px; width:600px; color:#8a8a8a; font-size:18px; font-weight:400; letter-spacing:2px; text-transform:uppercase;">
    A Keynote-Standard Redesign Workflow
  </div>

  <!-- Hero word, dead center -->
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:0px; top:380px; width:1920px; height:320px; text-align:center; color:#ffffff; font-size:240px; font-weight:700; letter-spacing:-8px; line-height:1.3;">
    Delete.
  </div>

  <!-- Sub-mark, bottom-right -->
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:1240px; top:980px; width:600px; text-align:right; color:#8a8a8a; font-size:18px; font-weight:400; letter-spacing:2px; text-transform:uppercase;">
    Skill · Deck Redesign · 2026
  </div>

</div>
</body>
</html>
