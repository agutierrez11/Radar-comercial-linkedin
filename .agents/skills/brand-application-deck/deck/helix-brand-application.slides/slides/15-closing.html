<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Helix — Closing</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400&display=swap" rel="stylesheet">
<style> body { margin:0; padding:0; overflow:hidden; background:#0F2540; } </style>
</head>
<body>
<div class="slide-container" style="position:relative; width:1920px; height:1080px; overflow:hidden; background:#0F2540;">

  <!-- Full-bleed brand photograph -->
  <div data-object="true" data-object-type="image"
       style="position:absolute; left:0; top:0; width:1920px; height:1080px; z-index:1; overflow:hidden;">
    <img src="../assets/hero-closing.png" alt="Helix brand photograph — server rack at rest"
         style="width:100%; height:100%; object-fit:cover; object-position:center; display:block;">
  </div>

  <!-- Navy gradient overlay for type legibility on left two-thirds -->
  <div data-object="true" data-object-type="shape"
       style="position:absolute; left:0; top:0; width:1280px; height:1080px;
              background:linear-gradient(90deg, rgba(15,37,64,0.94) 0%, rgba(15,37,64,0.85) 60%, rgba(15,37,64,0.2) 100%); z-index:2;"></div>

  <!-- 6% electric overlay across the photo (brand photo treatment) -->
  <div data-object="true" data-object-type="shape"
       style="position:absolute; left:0; top:0; width:1920px; height:1080px; background:#0066FF; opacity:0.04; z-index:3;"></div>

  <!-- Wordmark top-left -->
  <div data-object="true" data-object-type="textbox"
       style="position:absolute; left:120px; top:120px; width:400px; z-index:10;
              font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:26px;
              color:#FFFFFF; letter-spacing:-0.02em;">
    Helix<span style="color:#0066FF;">.</span>
  </div>

  <!-- Eyebrow -->
  <div data-object="true" data-object-type="textbox"
       style="position:absolute; left:120px; top:340px; width:600px; z-index:10;
              font-family:'Space Grotesk', sans-serif; font-weight:500; font-size:22px;
              color:#0066FF; letter-spacing:0.22em; text-transform:uppercase;">
    Closing
  </div>

  <!-- H1 — sized to fit the textbox with descender room -->
  <div data-object="true" data-object-type="textbox"
       style="position:absolute; left:120px; top:420px; width:1500px; z-index:10;
              font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:128px;
              line-height:1.04; color:#FFFFFF; letter-spacing:-0.04em;">
    19 days from<br>signature to served.
  </div>

  <!-- rule -->
  <div data-object="true" data-object-type="shape"
       style="position:absolute; left:120px; top:790px; width:120px; height:6px; background:#0066FF; z-index:5;"></div>

  <!-- Tagline -->
  <div data-object="true" data-object-type="textbox"
       style="position:absolute; left:120px; top:820px; width:1100px; z-index:10;
              font-family:'Inter', sans-serif; font-size:26px; line-height:1.45;
              color:#FFFFFF;">
    That is the only number that matters in this pitch — and the only one Helix is built to defend.
  </div>

  <!-- Concrete next step -->
  <div data-object="true" data-object-type="shape"
       style="position:absolute; left:120px; top:960px; width:880px; height:1px; background:rgba(255,255,255,0.25); z-index:5;"></div>
  <div data-object="true" data-object-type="textbox"
       style="position:absolute; left:120px; top:980px; width:880px; z-index:10;
              font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:14px;
              color:#0066FF; letter-spacing:0.18em; text-transform:uppercase;">
    Next step
  </div>
  <div data-object="true" data-object-type="textbox"
       style="position:absolute; left:120px; top:1010px; width:1200px; z-index:10;
              font-family:'Inter', sans-serif; font-size:20px; line-height:1.5;
              color:#E6ECF2;">
    30-minute scoping call · proposed Thu 22 May 2026, 14:00 CET · daniel.kade@helix.com
  </div>
</div>
</body>
</html>
