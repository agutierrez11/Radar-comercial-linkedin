<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Helix — Cover</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:0; overflow:hidden; background:#0F2540; font-family:'Inter', sans-serif; }
</style>
</head>
<body>
<div class="slide-container" style="position:relative; width:1920px; height:1080px; overflow:hidden; background:#0F2540;">

  <!-- Navy field (shape) -->
  <div data-object="true" data-object-type="shape"
       style="position:absolute; left:0; top:0; width:1920px; height:1080px; background:#0F2540; z-index:1;"></div>

  <!-- Right-third brand hero image -->
  <div data-object="true" data-object-type="image"
       style="position:absolute; left:1280px; top:0; width:640px; height:1080px; z-index:5; overflow:hidden;">
    <img src="../assets/hero-cover.png" alt="Helix brand hero — data-center corridor"
         style="width:100%; height:100%; object-fit:cover; object-position:center; display:block;">
  </div>

  <!-- 6% electric overlay on hero (brand photo treatment) -->
  <div data-object="true" data-object-type="shape"
       style="position:absolute; left:1280px; top:0; width:640px; height:1080px; background:#0066FF; opacity:0.06; z-index:5;"></div>

  <!-- Electric blue rule (brand signature) -->
  <div data-object="true" data-object-type="shape"
       style="position:absolute; left:120px; top:540px; width:120px; height:6px; background:#0066FF; z-index:5;"></div>

  <!-- Wordmark -->
  <div data-object="true" data-object-type="textbox"
       style="position:absolute; left:120px; top:120px; width:600px; z-index:10;
              font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:42px;
              color:#FFFFFF; letter-spacing:-0.02em;">
    Helix<span style="color:#0066FF;">.</span>
  </div>

  <!-- Eyebrow -->
  <div data-object="true" data-object-type="textbox"
       style="position:absolute; left:120px; top:460px; width:1000px; z-index:10;
              font-family:'Space Grotesk', sans-serif; font-weight:500; font-size:22px;
              color:#0066FF; letter-spacing:0.18em; text-transform:uppercase;">
    Enterprise pitch · Q2 2026 · Confidential
  </div>

  <!-- H1 -->
  <div data-object="true" data-object-type="textbox"
       style="position:absolute; left:120px; top:580px; width:1120px; z-index:10;
              font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:96px;
              line-height:1.02; color:#FFFFFF; letter-spacing:-0.03em;">
    Infrastructure that<br>deploys in hours,<br>not quarters.
  </div>

  <!-- Audience line -->
  <div data-object="true" data-object-type="textbox"
       style="position:absolute; left:120px; top:945px; width:1100px; z-index:10;
              font-family:'Inter', sans-serif; font-weight:400; font-size:22px;
              color:#E6ECF2;">
    Prepared for Northwind Logistics · RFP-2026-NW-014 · May 2026
  </div>

  <!-- Footer / brand stamp -->
  <div data-object="true" data-object-type="textbox"
       style="position:absolute; left:120px; top:1014px; width:600px; z-index:10;
              font-family:'Inter', sans-serif; font-weight:400; font-size:14px;
              color:#6B7785;">
    helix.com · daniel.kade@helix.com
  </div>
</div>
</body>
</html>
